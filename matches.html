<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">	

    <title>Redcar Old Boys – Matches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<script>

if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "pin.html";
}

</script>

    <!-- Club header -->
    <header class="club-header">
        <img src="robfc_logo.png" alt="ROB FC Logo" class="club-logo">
        <h1>Redcar Old Boys – Match Ratings</h1>
    </header>

    <!-- Fixture list container -->
    <div class="container">
    <h2>2026/27 Fixtures</h2>

    <div id="fixtureList" class="fixture-cards"></div>

    <button class="rate-button" onclick="goHome()">Back to Home</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCLLsZUdD9nNHxHU5M9hOWPZkl25e3iq9Y",
    authDomain: "redcar-ratings.firebaseapp.com",
    databaseURL: "https://redcar-ratings-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "redcar-ratings",
    storageBucket: "redcar-ratings.appspot.com",
    messagingSenderId: "360401254056",
    appId: "1:360401254056:web:d91fb63e5f95c6e790349d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

</script>

    <script src="app.js"></script>
    <script>

        // Fixtures loaded from Firebase
let fixtures = [];

function formatDate(dateString) {
    const date = new Date(dateString);

    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = String(date.getFullYear()).slice(-2);

    return `${day}/${month}/${year}`;
}

        const fixtureList = document.getElementById("fixtureList");

db.ref("fixtures").once("value").then((snapshot) => {

    fixtures = [];

    fixtureList.innerHTML = "";

    snapshot.forEach((childSnapshot) => {

        fixtures.push(childSnapshot.val());

    });

    fixtures.forEach((match, index) => {

        const card = document.createElement("div");

card.className =
    match.location.toUpperCase() === "HOME"
        ? "fixture-card"
        : "fixture-card away";

card.innerHTML = `

    <h3>${match.opponent}</h3>

    <div class="fixture-meta">

        <span class="fixture-date">
            📅 ${formatDate(match.date)}
        </span>

        <span class="fixture-location">
            ${match.location.toUpperCase()}
        </span>

    </div>

`;

fixtureList.appendChild(card);

});

        // Navigation functions
    function rateMatch(index) {
        localStorage.setItem("selectedMatch", JSON.stringify(fixtures[index]));
        window.location.href = "rate.html";
    }

});

// Navigation functions
function goHome() {
    window.location.href = "index.html";
}

</script>
</body>
</html>
