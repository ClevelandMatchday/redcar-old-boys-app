<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Details</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<script>

if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "pin.html";
}

</script>


<header class="club-header">

<img src="robfc_logo.png" alt="ROB FC Logo" class="club-logo">

<h1>Match Details</h1>

</header>



<div class="container">


<div class="profile-card">

<h2 id="opponent">
Loading...
</h2>


<p>
📅 Date:
<br>
<span id="matchDate"></span>
</p>


<p>
📍 Location:
<br>
<span id="location"></span>
</p>


<p>
🏟 Ground:
<br>
<span id="ground">
To be confirmed
</span>
</p>


<p>
⏰ Kick Off:
<br>
<span id="kickoff">
To be confirmed
</span>
</p>

<p>
🤝 Meet Time:
<br>
<span id="meetTime">
To be confirmed
</span>
</p>

<p>
👕 Kit:
<br>
<span id="kit">
To be confirmed
</span>
</p>


</div>



<button onclick="goBack()">
Back to Fixtures
</button>


</div>



<script>


const match = JSON.parse(localStorage.getItem("selectedMatch"));

console.log(match);

function formatDate(dateString){

    const date = new Date(dateString);

    const day = String(date.getDate()).padStart(2,"0");
    const month = String(date.getMonth()+1).padStart(2,"0");
    const year = String(date.getFullYear()).slice(-2);

    return `${day}/${month}/${year}`;

}

if(match){


document.getElementById("opponent").innerHTML =
match.opponent;


document.getElementById("matchDate").textContent =
formatDate(match.date);


document.getElementById("location").innerHTML =
match.location;



console.log("Ground:", match.ground);
console.log("Kickoff:", match.kickoff);
console.log("Meet:", match.meetTime);
console.log("Kit:", match.kit);

document.getElementById("ground").textContent = match.ground;
document.getElementById("kickoff").textContent = match.kickoff;
document.getElementById("meetTime").textContent = match.meetTime;
document.getElementById("kit").textContent = match.kit;


}


function goBack(){

window.location.href="matches.html";

}


</script>

</body>

</html>
