<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Details</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<script>

if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "pin.html";
}

</script>


<header class="club-header">

<img src="robfc_logo.png" alt="ROB FC Logo" class="club-logo">

<h1>Match Details</h1>

</header>



<div class="container">


<div class="profile-card">

    <h2 id="opponent">Loading...</h2>

    <div class="section">

        <h3>📅 MATCH INFORMATION</h3>

        <div class="info-row">
            <span class="label">Date</span>
            <span id="matchDate"></span>
        </div>

        <div class="info-row">
            <span class="label">Kick Off</span>
            <span id="kickoff"></span>
        </div>

        <div class="info-row">
            <span class="label">Meet Time</span>
            <span id="meetTime"></span>
        </div>

        <div class="info-row">
            <span class="label">Location</span>
            <span id="location"></span>
        </div>

    </div>


    <div class="section">

        <h3>📍 VENUE</h3>

        <p id="ground"></p>

        <div class="info-row">
            <span class="label">Pitch</span>
            <span id="pitchType"></span>
        </div>

        <button id="mapButton" class="map-button">
            🗺 Open in Google Maps
        </button>

    </div>


    <div class="section">

        <h3>👕 PLAYING KIT</h3>

        <p id="kit"></p>

    </div>


    <div class="section">

        <h3>🙋 AVAILABILITY</h3>

        <p style="color:#777;">
            Coming Soon
        </p>

    </div>


    <div class="section">

        <h3>⭐ PLAYER RATINGS</h3>

        <button id="rateButton"></button>

    </div>


    <div class="section">

        <h3>📰 MATCH REPORT</h3>

        <p style="color:#777;">
            Available after Full Time
        </p>

    </div>

</div>


<button id="rateButton" class="rate-button" onclick="goToRatings()">
⭐ Rate Players
</button>

<button onclick="goBack()">
Back to Fixtures
</button>


</div>



<script>


const match = JSON.parse(localStorage.getItem("selectedMatch"));

const rateButton = document.getElementById("rateButton");

console.log(match);

function formatDate(dateString){

    const date = new Date(dateString);

    const day = String(date.getDate()).padStart(2,"0");
    const month = String(date.getMonth()+1).padStart(2,"0");
    const year = String(date.getFullYear()).slice(-2);

    return `${day}/${month}/${year}`;

}

if(match){

const kickoffDateTime = new Date(
    `${match.date}T${match.kickoff}:00`
);

const closingDateTime = new Date(kickoffDateTime);

closingDateTime.setHours(
    closingDateTime.getHours() + 48
);

const now = new Date();

if (now < kickoffDateTime) {

    rateButton.textContent = "🔒 Ratings Available After Match";
    rateButton.disabled = true;

}
else if (now <= closingDateTime) {

    rateButton.textContent = "⭐ Rate Players";
    rateButton.disabled = false;

}
else {

    rateButton.textContent = "⛔ Ratings Closed";
    rateButton.disabled = true;

}

console.log("Kick Off:", kickoffDateTime);

console.log("Closing:", closingDateTime);

console.log("Now:", now);

document.getElementById("opponent").textContent =
match.opponent;

document.getElementById("matchDate").innerHTML =
formatDate(match.date);

document.getElementById("location").textContent =
match.location;

document.getElementById("ground").textContent =
match.ground || "To be confirmed";

document.getElementById("pitchType").textContent =
match.pitchType || "To be confirmed";

document.getElementById("kickoff").textContent =
match.kickoff || "To be confirmed";

document.getElementById("meetTime").textContent =
match.meetTime || "To be confirmed";

document.getElementById("kit").textContent =
match.kit || "To be confirmed";

const mapButton = document.getElementById("mapButton");

if(match.mapLink){

    mapButton.style.display = "inline-block";

    mapButton.onclick = function(){

       console.log(match.mapLink);

       window.open(match.mapLink, "_blank");
       

    };

}else{

    mapButton.style.display = "none";

}

}

function goToRatings(){

    localStorage.setItem(
        "selectedMatch",
        JSON.stringify(match)
    );

    window.location.href = "rate.html";

}

function goBack(){

window.location.href="matches.html";

}


</script>

</body>

</html>
