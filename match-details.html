<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Details</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<script>

if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "pin.html";
}

</script>


<header class="club-header">

<img src="robfc_logo.png" alt="ROB FC Logo" class="club-logo">

<h1>Match Details</h1>

</header>



<div class="container">


<div class="profile-card">

    <!-- MATCH HEADER -->

    <h2 id="opponent" class="fixture-title">
        Loading...
    </h2>

    <div class="section">

        <h3>📅 MATCH INFORMATION</h3>

        <p class="fixture-date-large" id="matchDate">
            Saturday, 8 August 2026
        </p>

        <div class="info-row">
            <span>⏰ Kick Off</span>
            <span id="kickoffTop"></span>
        </div>

        <div class="info-row">
            <span>🤝 Meet Time</span>
            <span id="meetTime"></span>
        </div>

        <div class="badge-container">
            <div id="homeAwayBadge" class="away-badge">
                AWAY
            </div>
        </div>

    </div>

    <!-- VENUE -->

    <div class="section">

        <h3>🏟 VENUE</h3>

        <p class="ground-name" id="ground"></p>

        <div class="info-row">
            <span>🌱 Surface</span>
            <span id="pitchType"></span>
        </div>

        <button id="mapButton" class="map-button">
            🗺 Open in Google Maps
        </button>

    </div>

    <!-- PLAYING KIT -->

    <div class="section">

        <h3>👕 PLAYING KIT</h3>

        <p id="kit" class="centre-text"></p>

    </div>

    <!-- AVAILABILITY -->

    <div class="section">

        <h3>🙋 AVAILABILITY</h3>

        <p class="coming-soon">
            Opens 7 days before kick off
        </p>

    </div>

    <!-- PLAYER RATINGS -->

    <div class="section">

        <h3>⭐ PLAYER RATINGS</h3>

        <button id="rateButton"></button>

    </div>

    <!-- MATCH REPORT -->

    <div class="section">

        <h3>📰 MATCH REPORT</h3>

        <p class="coming-soon">
            Published after Full Time
        </p>

    </div>

</div>

</div>

<button onclick="goBack()">
Back to Fixtures
</button>


</div>



<script>


const match = JSON.parse(localStorage.getItem("selectedMatch"));

const rateButton = document.getElementById("rateButton");

console.log("Rate button:", rateButton);

console.log(match);

function formatDate(dateString){

    const date = new Date(dateString);

    const options = {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    };

    return date.toLocaleDateString("en-GB", options);

}
if(match){

const kickoffDateTime = new Date(
    `${match.date}T${match.kickoff}:00`
);

const closingDateTime = new Date(kickoffDateTime);

closingDateTime.setHours(
    closingDateTime.getHours() + 48
);

const now = new Date();

// Match title
document.getElementById("opponent").textContent =
    match.opponent;

// Date
document.getElementById("matchDate").textContent =
    formatDate(match.date);

// Kick Off
document.getElementById("kickoffTop").textContent =
    match.kickoff || "TBC";

// Meet Time
document.getElementById("meetTime").textContent =
    match.meetTime || "TBC";

// Home / Away badge
const badge = document.getElementById("homeAwayBadge");

badge.textContent = match.location.toUpperCase();

badge.className =
    match.location.toUpperCase() === "HOME"
        ? "home-badge"
        : "away-badge";

// Ground
document.getElementById("ground").textContent =
    match.ground || "To be confirmed";

// Pitch
document.getElementById("pitchType").textContent =
    match.pitchType
        ? match.pitchType.charAt(0).toUpperCase() +
          match.pitchType.slice(1) +
          " Pitch"
        : "To be confirmed";

// Kit
document.getElementById("kit").textContent =
    match.kit
        ? match.kit + " Kit"
        : "To be confirmed";

const mapButton = document.getElementById("mapButton");

if(match.mapLink){

    mapButton.style.display = "inline-block";

    mapButton.onclick = function(){

       console.log(match.mapLink);

       window.open(match.mapLink, "_blank");

    };

}else{

    mapButton.style.display = "none";

}


// PLAYER RATINGS BUTTON

console.log("Ratings code reached");

if (now < kickoffDateTime) {

    rateButton.textContent = "🔒 Ratings Available After Match";
    rateButton.disabled = true;

}
else if (now <= closingDateTime) {

    rateButton.textContent = "⭐ Rate Players";
    rateButton.disabled = false;

}
else {

    rateButton.textContent = "⛔ Ratings Closed";
    rateButton.disabled = true;

}

rateButton.onclick = function(){

    if(!rateButton.disabled){

        goToRatings();

    }

};

}   // <-- Move the closing brace HERE

function goToRatings(){

    localStorage.setItem(
        "selectedMatch",
        JSON.stringify(match)
    );

    window.location.href = "rate.html";

}

function goBack(){

    window.location.href = "matches.html";

}

</script>

</body>

</html>
