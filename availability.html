<!DOCTYPE html>

<title>Availability</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="club-header">
    <img src="robfc_logo.png" alt="ROB FC Logo" class="club-logo">
    <h1>Redcar Old Boys</h1>
</header>

<div class="container">

<div class="profile-card">

<div class="section">

<h2 style="text-align:center;color:#002366;">
🙋 Match Availability
</h2>

<div class="match-date" id="matchDate"></div>

<div class="match-kickoff">
Kick Off <strong id="kickoff"></strong>
</div>

<div id="homeAwayBadge"
class="away-badge"
style="margin-top:20px;">
AWAY
</div>

</div>


<div class="section">

<h3>YOUR AVAILABILITY</h3>

<label class="availability-option">

<input
type="radio"
name="availability"
value="available">

🟢 Available

</label>

<label class="availability-option">

<input
type="radio"
name="availability"
value="late">

🟡 Late

</label>

<label class="availability-option">

<input
type="radio"
name="availability"
value="unavailable">

🔴 Unavailable

</label>

</div>


<div class="section">

<h3>LAST UPDATED</h3>

<p id="lastUpdated">

Never

</p>

</div>


<button
class="menu-button"
id="saveButton">

Save Availability

</button>

<button
class="menu-button"
onclick="goBack()">

Back to Match

</button>

</div>

</div>
