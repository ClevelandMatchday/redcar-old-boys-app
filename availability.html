<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Availability</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="club-header">
    <img src="robfc_logo.png" alt="ROB FC Logo" class="club-logo">
    <h1>Redcar Old Boys</h1>
</header>

<div class="container">

<div class="profile-card">

<div class="section">

<h2 style="text-align:center;color:#002366;">
🙋 Availability
</h2>

<h2 id="opponent" class="match-opponent"></h2>

<div
class="match-date"
id="matchDate">
</div>

<div class="match-kickoff">
Kick Off
<strong id="kickoff"></strong>
</div>

<div class="match-kickoff">
Meet Time
<strong id="meetTime"></strong>
</div>

<div
id="homeAwayBadge"
class="away-badge"
style="margin-top:20px;">
</div>

<div class="section">

<h3>AVAILABILITY</h3>

<label class="availability-option">

<input
type="radio"
name="availability"
value="available">

<span class="availability-label">
🟢 Available
</span>

</label>

<label class="availability-option">

<input
type="radio"
name="availability"
value="late">

<span class="availability-label">
🟡 Late
</span>

</label>

<label class="availability-option">

<input
type="radio"
name="availability"
value="unavailable">

<span class="availability-label">
🔴 Unavailable
</span>

</label>

</div>


<div class="section">

<h3>LAST UPDATED</h3>

<div id="lastUpdated">

<div id="updatedDate">
Never
</div>

<div id="updatedTime"></div>

</div>

<button
class="menu-button"
id="saveButton">

Save Response

</button>

<button
class="menu-button"
onclick="goBack()">

Back to Match

</button>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyCLLsZUdD9nNHxHU5M9hOWPZkl25e3iq9Y",
authDomain: "redcar-ratings.firebaseapp.com",
databaseURL: "https://redcar-ratings-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "redcar-ratings",
storageBucket: "redcar-ratings.appspot.com",
messagingSenderId: "360401254056",
appId: "1:360401254056:web:d91fb63e5f95c6e790349d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const match = JSON.parse(
    localStorage.getItem("selectedMatch")
);

function formatDate(dateString){

    const date = new Date(dateString);

    return date.toLocaleDateString("en-GB",{

        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"

    });

}

if(match){

    document.getElementById("matchDate").textContent =
        formatDate(match.date);

    document.getElementById("kickoff").textContent =
        match.kickoff;

    document.getElementById("opponent").textContent =
    match.opponent;

    document.getElementById("meetTime").textContent =
    match.meetTime || "TBC";

    const badge =
        document.getElementById("homeAwayBadge");

    badge.textContent =
        match.location.toUpperCase();

    badge.className =
        match.location.toUpperCase() === "HOME"
            ? "home-badge"
            : "away-badge";

}

function goBack(){

window.location.href="match-details.html";

}

</script>

</body>

</html>
