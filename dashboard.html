<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROB Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<script>

if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "pin.html";
}

</script>

<header class="club-header">
    <img src="robfc_logo.png" alt="ROB FC Logo" class="club-logo">
    <h1>Redcar Old Boys</h1>
</header>


<div class="container">

<h2 id="welcomeMessage"></h2>

<div id="userInfo" class="profile-card"></div>

<div id="dashboardButtons"></div>

</div>


<script src="app.js"></script>

<script>

const name = localStorage.getItem("userName");
const role = localStorage.getItem("userRole");
const position = localStorage.getItem("userPosition");
const team = localStorage.getItem("userTeam");


document.getElementById("welcomeMessage").innerHTML =
`Welcome back, ${name}`;


document.getElementById("userInfo").innerHTML =
`

<h3>PLAYER PROFILE</h3>

<p>
<strong>Name</strong><br>
${name}
</p>

<p>
<strong>Position</strong><br>
${position}
</p>

<p>
<strong>Team</strong><br>
${team}
</p>

`;



const dashboardButtons = document.getElementById("dashboardButtons");


if (role === "player") {

dashboardButtons.innerHTML = `

<button onclick="goToMatches()">Matches</button>

<button onclick="goToReports()">Match Reports</button>

<button onclick="goToTraining()">Training</button>

`;

}



if (role === "coach") {

dashboardButtons.innerHTML = `

<button onclick="goToMatches()">Fixtures</button>

<button onclick="goToReports()">Match Reports</button>

<button>Team Ratings</button>

<button onclick="goToTraining()">Training</button>

`;

}



if (role === "admin") {

dashboardButtons.innerHTML = `

<button>Manage Users</button>

<button>Manage Fixtures</button>

<button>Reports</button>

<button>Club Admin</button>

`;

}



function goToMatches(){

window.location.href="matches.html";

}


function goToTraining(){

window.location.href="training.html";

}

</script>

</body>
</html>
