<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Sheet</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="club-header">

    <img src="robfc_logo.png"
         alt="ROB FC Logo"
         class="club-logo">

    <h1>Redcar Old Boys</h1>

</header>


<div class="container">

<div class="profile-card">

<!-- ========================= -->
<!-- MATCH DETAILS -->
<!-- ========================= -->

<div class="section">

<h2 style="text-align:center;color:#002366;">

⚽ Team Sheet

</h2>

<h2 id="opponent" class="match-opponent"></h2>

<div
class="match-date"
id="matchDate">
</div>

<div class="match-kickoff">

Kick Off

<strong id="kickoff"></strong>

</div>

<div class="match-kickoff">

Meet Time

<strong id="meetTime"></strong>

</div>

<div
id="homeAwayBadge"
class="away-badge"
style="margin-top:20px;">

</div>

</div>


<!-- ========================= -->
<!-- SELECTED SQUAD -->
<!-- ========================= -->

<div class="section">

<h3>SELECTED SQUAD</h3>

<div id="selectedSquad">

<p style="text-align:center;color:#666;">

Loading squad...

</p>

</div>

</div>


<!-- ========================= -->
<!-- TEAM SUMMARY -->
<!-- ========================= -->

<div class="section">

<h3>TEAM SUMMARY</h3>

<div class="summary-grid">

<div class="summary-card available">

<div id="starterCount">

0

</div>

<div>

Starters

</div>

</div>

<div class="summary-card late">

<div id="subCount">

0

</div>

<div>

Subs

</div>

</div>

</div>

</div>


<!-- ========================= -->
<!-- SAVE -->
<!-- ========================= -->

<div class="section">

<button
class="menu-button"
id="saveTeamSheet">

💾 Save Team Sheet

</button>

<button
class="menu-button"
onclick="goBack()">

Back to Build Squad

</button>

</div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>

// ===============================
// FIREBASE
// ===============================

const firebaseConfig = {
    apiKey: "AIzaSyCLLsZUdD9nNHxHU5M9hOWPZkl25e3iq9Y",
    authDomain: "redcar-ratings.firebaseapp.com",
    databaseURL: "https://redcar-ratings-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "redcar-ratings",
    storageBucket: "redcar-ratings.appspot.com",
    messagingSenderId: "360401254056",
    appId: "1:360401254056:web:d91fb63e5f95c6e790349d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// ===============================
// POSITION NAME LOOKUP
// ===============================

const positionNames = {

    GK: "Goalkeeper",
    LB: "Left Back",
    CB: "Centre Back",
    RB: "Right Back",
    FB: "Full Back",

    LWB: "Left Wing Back",
    RWB: "Right Wing Back",

    DM: "Defensive Midfield",
    CM: "Central Midfield",
    AM: "Attacking Midfield",

    LW: "Left Wing",
    RW: "Right Wing",

    ST: "Striker"

};

const positionColours = {

    GK: "position-gk",

    CB: "position-def",
    FB: "position-def",
    LB: "position-def",
    RB: "position-def",
    LWB: "position-def",
    RWB: "position-def",

    DM: "position-mid",
    CM: "position-mid",
    AM: "position-mid",
    LM: "position-mid",
    RM: "position-mid",

    LW: "position-att",
    RW: "position-att",
    ST: "position-att"

};


// ===============================
// CURRENT MATCH
// ===============================

const match = JSON.parse(
    localStorage.getItem("selectedMatch")
);

// ===============================
// TEAM SHEET DATA
// ===============================

let playerRoles = {};

// ===============================
// DATE FORMAT
// ===============================

function formatDate(dateString){

    const date = new Date(dateString);

    return date.toLocaleDateString("en-GB",{

        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"

    });

}


// ===============================
// LOAD MATCH DETAILS
// ===============================

if(match){

    document.getElementById("opponent").textContent =
        match.opponent;

    document.getElementById("matchDate").textContent =
        formatDate(match.date);

    document.getElementById("kickoff").textContent =
        match.kickoff;

    document.getElementById("meetTime").textContent =
        match.meetTime || "TBC";

    const badge =
        document.getElementById("homeAwayBadge");

    badge.textContent =
        match.location.toUpperCase();

    badge.className =
        match.location.toUpperCase() === "HOME"
        ? "home-badge"
        : "away-badge";

}

// ===============================
// LOAD SELECTED SQUAD
// ===============================

Promise.all([

    db.ref("players").get(),

    db.ref(
        "fixtures/" +
        match.fixtureID +
        "/squad"
    ).get()

])

.then(([playersSnap, squadSnap]) => {

    const container =
        document.getElementById("selectedSquad");

    container.innerHTML = "";

    const squad =
        squadSnap.val() || {};

    playersSnap.forEach(player => {

        if(!squad[player.key]) return;

        const data = player.val();

        const card =
            document.createElement("div");

        card.className =
            "team-player-card";

        card.innerHTML = `

<div class="player-name">

    ${data.name}

</div>

<div class="preferred-position-title">

    Preferred Position

</div>

<div class="player-position">

    <span class="position-pill ${positionColours[data.position]}">

        ${positionNames[data.position] || data.position}

    </span>

</div>

<div class="match-position-title">

    Match Position

</div>

<select class="match-position-select">

    <option value="">Select Position</option>

    <option>Goalkeeper</option>

    <option>Left Back</option>
    
    <option>Centre Back</option>

    <option>Right Back</option>

    <option>Left Wing Back</option>

    <option>Right Wing Back</option>

    <option>Defensive Midfield</option>

    <option>Central Midfield</option>

    <option>Attacking Midfield</option>

    <option>Left Wing</option>

    <option>Right Wing</option>

    <option>Striker</option>

</select>

<div class="player-role-title">

    Match Role

</div>

<div class="player-role">

    <label>

        <input
            type="radio"
            name="role_${player.key}"
            value="starter"
            onchange="updateRole('${player.key}','starter')">

        Starter

    </label>

    <label>

        <input
            type="radio"
            name="role_${player.key}"
            value="sub"
            onchange="updateRole('${player.key}','sub')">

        Substitute

    </label>

</div>

`; 

        container.appendChild(card);

        updateSummary();

    });

});

// ===============================
// UPDATE PLAYER ROLE
// ===============================

function updateRole(playerID, role){

    playerRoles[playerID] = role;

    updateSummary();

}


// ===============================
// UPDATE TEAM SUMMARY
// ===============================

function updateSummary(){

    let starters = 0;
    let subs = 0;

    Object.values(playerRoles).forEach(role=>{

        if(role==="starter") starters++;

        if(role==="sub") subs++;

    });

    document.getElementById("starterCount").textContent =
        starters;

    document.getElementById("subCount").textContent =
        subs;

}

function goBack(){

    window.location.href =
    "build-squad.html";

}

</script>

</body>

</html>
