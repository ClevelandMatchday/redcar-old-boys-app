<option value="4-4-2">
4-4-2
</option>

<option value="4-3-3">
4-3-3
</option>

4-2-3-1
</option>

3-5-2

class="menu-button"

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>

// ===============================
// FIREBASE
// ===============================

const firebaseConfig = {
    apiKey: "AIzaSyCLLsZUdD9nNHxHU5M9hOWPZkl25e3iq9Y",
    authDomain: "redcar-ratings.firebaseapp.com",
    databaseURL: "https://redcar-ratings-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "redcar-ratings",
    storageBucket: "redcar-ratings.appspot.com",
    messagingSenderId: "360401254056",
    appId: "1:360401254056:web:d91fb63e5f95c6e790349d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

// ===============================
// FORMATION STRUCTURE
// ===============================

const formations = {

    "4-4-2":[

        "Goalkeeper",

        "Left Back",
        "Centre Back",
        "Centre Back",
        "Right Back",

        "Left Midfield",
        "Centre Midfield",
        "Centre Midfield",
        "Right Midfield",

        "Striker",
        "Striker"

    ],

    "4-3-3":[

        "Goalkeeper",

        "Left Back",
        "Centre Back",
        "Centre Back",
        "Right Back",

        "Central Midfield",
        "Central Midfield",
        "Central Midfield",

        "Left Wing",
        "Striker",
        "Right Wing"

    ]

};

// ===============================
// DISPLAY FORMATION
// ===============================

function loadFormation(formation){

    const pitchArea =
    document.getElementById("pitchArea");

    pitchArea.innerHTML = "";


    let assignedPlayers = [];


    formations[formation].forEach(position=>{


        let assignedPlayer = null;


        Object.keys(teamSheet).forEach(playerID=>{


            const player = teamSheet[playerID];


            if(
                !assignedPlayers.includes(playerID) &&
                player.role === "starter" &&
                player.position === position
            ){

                assignedPlayer = playerID;

                assignedPlayers.push(playerID);

            }


        });



        const slot =
        document.createElement("div");


        slot.className =
        "formation-slot";


        slot.innerHTML = `


        <strong>${position}</strong>


        <div class="formation-player">

        ${
            assignedPlayer
            ? getPlayerName(assignedPlayer)
            : "No player assigned"
        }

        </div>


        `;


        pitchArea.appendChild(slot);


    });


}

function getPlayerName(playerID){


    const player =
    firebase.database()
    .ref("players/" + playerID);


    return playerID;

}

        buildStartingXI();


document
.getElementById("formationSelect")
.addEventListener(
"change",
function(){

    loadFormation(this.value);

});

// ===============================
// BUILD STARTING XI
// ===============================

function buildStartingXI(){

    const slots =
    document.querySelectorAll(".formation-slot");


    slots.forEach(slot=>{

        const position =
        slot.querySelector("strong").textContent;


        const playerArea =
        slot.querySelector(".formation-player");


        let foundPlayer = null;


        Object.keys(teamSheet).forEach(playerID=>{


            const player =
            teamSheet[playerID];


            if(
                player.role === "starter" &&
                player.position === position
            ){

                foundPlayer = playerID;

            }


        });


        if(foundPlayer){

            playerArea.textContent =
            foundPlayer;

        }
        else{

            playerArea.textContent =
            "No player assigned";

        }


    });

}

// ===============================
// POSITION NAME LOOKUP
// ===============================

const positionNames = {

    GK: "Goalkeeper",
    LB: "Left Back",
    CB: "Centre Back",
    RB: "Right Back",
    FB: "Full Back",

    LWB: "Left Wing Back",
    RWB: "Right Wing Back",

    DM: "Defensive Midfield",
    CM: "Central Midfield",
    AM: "Attacking Midfield",

    LW: "Left Wing",
    RW: "Right Wing",

    ST: "Striker"

};

const positionColours = {

    GK: "position-gk",

    CB: "position-def",
    FB: "position-def",
    LB: "position-def",
    RB: "position-def",
    LWB: "position-def",
    RWB: "position-def",

    DM: "position-mid",
    CM: "position-mid",
    AM: "position-mid",
    LM: "position-mid",
    RM: "position-mid",

    LW: "position-att",
    RW: "position-att",
    ST: "position-att"

};


// ===============================
// CURRENT MATCH
// ===============================

const match = JSON.parse(
    localStorage.getItem("selectedMatch")
);

// ===============================
// TEAM SHEET DATA
// ===============================

let playerRoles = {};

let playerPositions = {};

let selectedCaptain = "";

let teamSheet = {};

let savedTeamSheet = {};

// ===============================
// DATE FORMAT
// ===============================

function formatDate(dateString){

    const date = new Date(dateString);

    return date.toLocaleDateString("en-GB",{

        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"

    });

}


// ===============================
// LOAD MATCH DETAILS
// ===============================

if(match){

    document.getElementById("opponent").textContent =
        match.opponent;

    document.getElementById("matchDate").textContent =
        formatDate(match.date);

    document.getElementById("kickoff").textContent =
        match.kickoff;

    document.getElementById("meetTime").textContent =
        match.meetTime || "TBC";

    const badge =
        document.getElementById("homeAwayBadge");

    badge.textContent =
        match.location.toUpperCase();

    badge.className =
        match.location.toUpperCase() === "HOME"
        ? "home-badge"
        : "away-badge";

}

// ===============================
// LOAD SELECTED SQUAD
// ===============================

Promise.all([

    db.ref("players").get(),

    db.ref(
        "fixtures/" +
        match.fixtureID +
        "/squad"
    ).get(),

    db.ref(
        "fixtures/" +
        match.fixtureID +
        "/teamSheet"
    ).get()

])

.then(([playersSnap, squadSnap, teamSheetSnap]) => {
    const container =
        document.getElementById("selectedSquad");

    container.innerHTML = "";

    const squad =
        squadSnap.val() || {};

    savedTeamSheet =
    teamSheetSnap.val() || {};

    console.log(
    "Saved Team Sheet:",
    savedTeamSheet
    );

    console.log("Saved Team Sheet:", savedTeamSheet);

    playersSnap.forEach(player => {

        if(!squad[player.key]) return;

        const data = player.val();

        const savedPlayer = savedTeamSheet[player.key] || {};

if(savedPlayer.position){

    playerPositions[player.key] = savedPlayer.position;

}

if(savedPlayer.role){

    playerRoles[player.key] = savedPlayer.role;

}

if(savedPlayer.captain){

    selectedCaptain = player.key;

}

        const card =
            document.createElement("div");

        card.className =
            "team-player-card";

        card.innerHTML = `

<div class="player-name">

    ${data.name}

</div>

<div class="preferred-position-title">

    Preferred Position

</div>

<div class="player-position">

    <span class="position-pill ${positionColours[data.position]}">

        ${positionNames[data.position] || data.position}

    </span>

</div>

<div class="match-position-title">

    Playing Position

</div>

<select 
class="match-position-select"
onchange="updatePosition('${player.key}', this.value)">
    
    <option value="">Select Position</option>

    <option value="Goalkeeper"
    ${savedPlayer.position==="Goalkeeper" ? "selected" : ""}>
    Goalkeeper
    </option>

    <option value="Left Back"
    ${savedPlayer.position==="Left Back" ? "selected" : ""}>
    Left Back
    </option>
    
    <option value="Centre Back"
    ${savedPlayer.position==="Centre Back" ? "selected" : ""}>
    Centre Back
    </option>

    <option value="Right Back"
    ${savedPlayer.position==="Right Back" ? "selected" : ""}>
    Right Back
    </option>

    <option value="Left Wing Back"
    ${savedPlayer.position==="Left Wing Back" ? "selected" : ""}>
    Left Wing Back
    </option>

    <option value="Right Wing Back"
    ${savedPlayer.position==="Right Wing Back" ? "selected" : ""}>
    Right Wing Back
    </option>


    <option value="Defensive Midfield"
    ${savedPlayer.position==="Defensive Midfield" ? "selected" : ""}>
    Defensive Midfield
    </option>


    <option value="Central Midfield"
    ${savedPlayer.position==="Central Midfield" ? "selected" : ""}>
    Central Midfield
    </option>


    <option value="Attacking Midfield"
    ${savedPlayer.position==="Attacking Midfield" ? "selected" : ""}>
    Attacking Midfield
    </option>


    <option value="Left Wing"
    ${savedPlayer.position==="Left Wing" ? "selected" : ""}>
    Left Wing
    </option>


    <option value="Right Wing"
    ${savedPlayer.position==="Right Wing" ? "selected" : ""}>
    Right Wing
    </option>

    <option value="Striker"
    ${savedPlayer.position==="Striker" ? "selected" : ""}>
    Striker
    </option>


</select>

<div class="player-role-title">

    Match Role

</div>

<div class="player-role">

    <label>

        <input
type="radio"
name="role_${player.key}"
value="starter"
${savedPlayer.role==="starter" ? "checked" : ""}
onchange="updateRole('${player.key}','starter')">

        Starter

    </label>

    <label>

<input
type="radio"
name="role_${player.key}"
value="sub"
${savedPlayer.role==="sub" ? "checked" : ""}
onchange="updateRole('${player.key}','sub')">

Substitute

</label>

</div>

<div class="captain-section">

    <button
    class="captain-button ${savedPlayer.captain ? 'captain-selected' : ''}"
    id="captain_${player.key}"
    onclick="selectCaptain('${player.key}')">

    ${savedPlayer.captain ? "⭐ Captain" : "🎖 Select Captain"}

    </button>

</div>

`; 

        container.appendChild(card);

if(savedPlayer.role){

    playerRoles[player.key] =
    savedPlayer.role;

}

if(savedPlayer.position){

    playerPositions[player.key] =
    savedPlayer.position;

}

if(savedPlayer.captain){

    selectedCaptain =
    player.key;

}

    });

       updateSummary();

buildTeamSheet();

loadFormation(
    document.getElementById("formationSelect").value
);
   
});

// ===============================
// UPDATE PLAYER ROLE
// ===============================

function updateRole(playerID, role){

    playerRoles[playerID] = role;

    updateSummary();

}

// ===============================
// UPDATE PLAYER POSITION
// ===============================

function updatePosition(playerID, position){

    playerPositions[playerID] = position;

}

function selectCaptain(playerID){


    selectedCaptain = playerID;


    document
    .querySelectorAll(".captain-button")
    .forEach(button=>{

        button.textContent =
        "🏳 Select Captain";

        button.classList.remove(
            "captain-selected"
        );

    });



    const selectedButton =
    document.getElementById(
        "captain_" + playerID
    );


    selectedButton.textContent =
    "⭐ Captain";

    selectedButton.classList.add(
        "captain-selected"
    );


}

// ===============================
// BUILD TEAM SHEET OBJECT
// ===============================

function buildTeamSheet(){

    teamSheet = {};


    Object.keys(playerRoles).forEach(playerID => {


        teamSheet[playerID] = {


            role:
            playerRoles[playerID],


            position:
            playerPositions[playerID] || "",


            captain:
            playerID === selectedCaptain


        };


    });


    console.log(
        "Final Team Sheet:",
        teamSheet
    );


}

// ===============================
// VALIDATE TEAM SHEET
// ===============================

function validateTeamSheet(){


    let starters = 0;
    let subs = 0;
    let captainCount = 0;;


    Object.keys(teamSheet).forEach(playerID => {


        const player = teamSheet[playerID];


        if(player.role === "starter"){

            starters++;

        }


        if(player.captain === true){

        captainCount++;

        }


        if(
            player.role === "starter" &&
            player.position === ""
        ){

            alert(
            "All starters must have a match position selected."
            );

            return false;

        }


    });


    if(starters === 0){

        alert(
        "Please select at least one starter."
        );

        return false;

    }


    if(captainCount === 0){

    alert(
    "Please select a captain."
    );

    return false;

    }


    if(captainCount > 1){

    alert(
    "Only one captain can be selected."
    );

    return false;

    }


    return true;

}

// ===============================
// SAVE TEAM SHEET TO FIREBASE
// ===============================

document
.getElementById("saveTeamSheet")
.addEventListener("click", function(){


    buildTeamSheet();


    if(!validateTeamSheet()){

        return;

    }


    db.ref(
        "fixtures/" +
        match.fixtureID +
        "/teamSheet"
    )

    .set(teamSheet)


    .then(()=>{


        alert(
        "Team Sheet saved successfully"
        );


        console.log(
        "Saved Team Sheet:",
        teamSheet
        );


    })


    .catch(error=>{


        console.error(
        "Saving Team Sheet failed:",
        error
        );


        alert(
        "Unable to save Team Sheet"
        );


    });


});

// ===============================
// UPDATE TEAM SUMMARY
// ===============================

function updateSummary(){

    let starters = 0;
    let subs = 0;

    Object.values(playerRoles).forEach(role=>{

        if(role==="starter") starters++;

        if(role==="sub") subs++;

    });

    document.getElementById("starterCount").textContent =
        starters;

    document.getElementById("subCount").textContent =
        subs;

}

function goBack(){

    window.location.href =
    "build-squad.html";

}

loadFormation("4-4-2");

</script>
